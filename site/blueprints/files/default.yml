# Fields shown when you open a file in the Panel.
#
# Kirby picks a file blueprint from the `Template:` line in the file's .txt
# sidecar and falls back to this one when there isn't any. The gallery images
# under content/works/ have no template, so this is the blueprint they use.
# (The starterkit's content/photography/ demo files do set Template: image and
# therefore use image.yml instead.)

title: Image

columns:
  - width: 2/3
    sections:
      content:
        type: fields
        fields:
          caption:
            label: Caption
            type: text
            help: Shown in grey under the image when it is selected in the gallery.

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          alt:
            label: Alternative Text
            type: text
            help: Describes the image for screen readers. Not shown on the page.
